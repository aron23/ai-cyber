# Docker Compose for World-Class Spam Filter Models
# Generated on 2025-06-16 12:47:51
# Models: 5 world-class models

version: '3.8'

services:

  spam-filter-neural-network-advanced:
    build:
      context: .
      dockerfile: Dockerfile.neural_network_advanced
    container_name: spam-filter-neural-network-advanced
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=neural_network_advanced
      - MODEL_VERSION=1.0.0
      - MODEL_TYPE=neural_network
      - F1_CAPABILITY=94.67
      - MODEL_NAME=neural_network_advanced
      - MODEL_TYPE=neural_network
      - F1_CAPABILITY=94.67
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    networks:
      - spam-filter-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2'
        reservations:
          memory: 2g
          cpus: '1'

  spam-filter-lightgbm-optimized:
    build:
      context: .
      dockerfile: Dockerfile.lightgbm_optimized
    container_name: spam-filter-lightgbm-optimized
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - MODEL_NAME=lightgbm_optimized
      - MODEL_VERSION=1.0.0
      - MODEL_TYPE=baseline
      - F1_CAPABILITY=89.93
      - MODEL_NAME=lightgbm_optimized
      - MODEL_TYPE=baseline
      - F1_CAPABILITY=89.93
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    networks:
      - spam-filter-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2'
        reservations:
          memory: 2g
          cpus: '1'

  spam-filter-xgboost-advanced:
    build:
      context: .
      dockerfile: Dockerfile.xgboost_advanced
    container_name: spam-filter-xgboost-advanced
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - MODEL_NAME=xgboost_advanced
      - MODEL_VERSION=1.0.0
      - MODEL_TYPE=baseline
      - F1_CAPABILITY=89.04
      - MODEL_NAME=xgboost_advanced
      - MODEL_TYPE=baseline
      - F1_CAPABILITY=89.04
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    networks:
      - spam-filter-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2'
        reservations:
          memory: 2g
          cpus: '1'

  spam-filter-ensemble-voting:
    build:
      context: .
      dockerfile: Dockerfile.ensemble_voting
    container_name: spam-filter-ensemble-voting
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      - MODEL_NAME=ensemble_voting
      - MODEL_VERSION=1.0.0
      - MODEL_TYPE=ensemble
      - F1_CAPABILITY=96.5
      - MODEL_NAME=ensemble_voting
      - MODEL_TYPE=ensemble
      - F1_CAPABILITY=96.5
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    networks:
      - spam-filter-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2'
        reservations:
          memory: 2g
          cpus: '1'

  spam-filter-ensemble-stacking:
    build:
      context: .
      dockerfile: Dockerfile.ensemble_stacking
    container_name: spam-filter-ensemble-stacking
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      - MODEL_NAME=ensemble_stacking
      - MODEL_VERSION=1.0.0
      - MODEL_TYPE=ensemble
      - F1_CAPABILITY=97.0
      - MODEL_NAME=ensemble_stacking
      - MODEL_TYPE=ensemble
      - F1_CAPABILITY=97.0
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    networks:
      - spam-filter-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2'
        reservations:
          memory: 2g
          cpus: '1'

  # Load Balancer for High Availability
  nginx-lb:
    image: nginx:alpine
    container_name: spam-filter-load-balancer
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - spam-filter-network
    depends_on:
      - spam-filter-neural-network-advanced
      - spam-filter-lightgbm-optimized
      - spam-filter-xgboost-advanced
      - spam-filter-ensemble-voting
      - spam-filter-ensemble-stacking

  # Monitoring and Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: spam-filter-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - spam-filter-network

  grafana:
    image: grafana/grafana:latest
    container_name: spam-filter-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    networks:
      - spam-filter-network
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

networks:
  spam-filter-network:
    driver: bridge
