apiVersion: apps/v1
kind: Deployment
metadata:
  name: spam-filter-neural-network-advanced
  namespace: spam-filter
  labels:
    app: spam-filter-neural-network-advanced
    model-type: neural_network
    f1-capability: "95"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: spam-filter-neural-network-advanced
  template:
    metadata:
      labels:
        app: spam-filter-neural-network-advanced
        model-type: neural_network
        f1-capability: "95"
    spec:
      containers:
      - name: spam-filter-neural-network-advanced
        image: spam-filter/neural_network_advanced:1.0.0
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: MODEL_NAME
          value: "neural_network_advanced"
        - name: MODEL_VERSION
          value: "1.0.0"
        - name: MODEL_TYPE
          value: "neural_network"
        - name: F1_CAPABILITY
          value: "94.67"
        envFrom:
        - configMapRef:
            name: spam-filter-config
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4g"
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 2
        volumeMounts:
        - name: model-storage
          mountPath: /app/models
          readOnly: true
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-storage-pvc
      - name: logs
        emptyDir: {}
      nodeSelector:
        workload-type: cpu-intensive
      tolerations:
      - key: "workload-type"
        operator: "Equal"
        value: "cpu-intensive"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: spam-filter-neural-network-advanced-service
  namespace: spam-filter
  labels:
    app: spam-filter-neural-network-advanced
spec:
  selector:
    app: spam-filter-neural-network-advanced
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  type: ClusterIP
