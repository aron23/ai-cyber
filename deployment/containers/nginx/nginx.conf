# Nginx Load Balancer Configuration
# Generated on 2025-06-16 12:47:51
# World-Class Spam Filter Models Load Balancing

upstream spam_filter_backend {
    server spam-filter-neural-network-advanced:8000 weight=9 max_fails=3 fail_timeout=30s;
    server spam-filter-lightgbm-optimized:8000 weight=8 max_fails=3 fail_timeout=30s;
    server spam-filter-xgboost-advanced:8000 weight=8 max_fails=3 fail_timeout=30s;
    server spam-filter-ensemble-voting:8000 weight=9 max_fails=3 fail_timeout=30s;
    server spam-filter-ensemble-stacking:8000 weight=9 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name spam-filter.local;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name spam-filter.local;
    
    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    
    # Security Headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
    
    # Request size limits
    client_max_body_size 10M;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Prediction endpoint with intelligent routing
    location /predict {
        proxy_pass http://spam_filter_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Load balancing based on response time
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 60s;
    }
    
    # Health check endpoint
    location /health {
        proxy_pass http://spam_filter_backend;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # Metrics endpoint (restricted access)
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        proxy_pass http://spam_filter_backend;
        proxy_set_header Host $host;
    }
    
    # Dashboard endpoint
    location /dashboard {
        proxy_pass http://spam_filter_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Static assets
    location /static {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    
    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://spam_filter_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
