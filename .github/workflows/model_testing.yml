name: Model Testing and Validation

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'models/**'
      - 'tests/**'
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.9'
  CACHE_NUMBER: 0  # Increment to reset cache

jobs:
  test-models:
    name: Run Model Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        test-suite: [performance, regression, ab-testing]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Full history for regression testing
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/.cache/torch
        key: ${{ runner.os }}-pip-${{ env.CACHE_NUMBER }}-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ env.CACHE_NUMBER }}-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-benchmark
    
    - name: Run ${{ matrix.test-suite }} tests
      run: |
        case "${{ matrix.test-suite }}" in
          performance)
            python -m pytest tests/test_model_performance.py -v --benchmark-only
            ;;
          regression)
            python scripts/run_regression_tests.py --baseline benchmarks/baseline_benchmarks.json
            ;;
          ab-testing)
            python scripts/run_ab_tests.py --config configs/ab_test_config.yaml
            ;;
        esac
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.test-suite }}
        path: |
          results/
          benchmarks/
          ab_test_results/
    
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const testType = '${{ matrix.test-suite }}';
          let comment = `## Model Test Results: ${testType}\n\n`;
          
          try {
            let resultFile;
            switch(testType) {
              case 'performance':
                resultFile = 'results/test_results.json';
                break;
              case 'regression':
                resultFile = 'results/regression_results.json';
                break;
              case 'ab-testing':
                resultFile = 'results/ab_test_results.json';
                break;
            }
            
            if (fs.existsSync(resultFile)) {
              const results = JSON.parse(fs.readFileSync(resultFile, 'utf8'));
              comment += '```json\n' + JSON.stringify(results, null, 2) + '\n```';
            } else {
              comment += 'No results file found.';
            }
          } catch (error) {
            comment += `Error reading results: ${error.message}`;
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  build-artifacts:
    name: Build Deployment Artifacts
    runs-on: ubuntu-latest
    needs: test-models
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Run build pipeline
      run: |
        python scripts/build_pipeline.py --config build/build_models.yml
    
    - name: Build deployment packages
      run: |
        # Get the best model from selection
        MODEL_PATH=$(jq -r '.best_model' results/model_selection.json)
        MODEL_NAME=$(jq -r '.model_name' results/model_selection.json)
        VERSION=$(date +%Y%m%d.%H%M%S)
        
        python scripts/create_deployment_package.py \
          --model-path "$MODEL_PATH" \
          --model-name "$MODEL_NAME" \
          --version "$VERSION"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: deployment-artifacts
        path: dist/
    
    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.tar.gz
          dist/*.whl
          dist/*_manifest.json
        body: |
          ## Model Release
          
          This release includes:
          - Model artifacts
          - Docker images
          - Deployment packages
          
          See manifest for details.