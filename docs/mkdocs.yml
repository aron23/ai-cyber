    - Quick Start: getting_started/quick_start.md
    - First Model: getting_started/first_model.md
  - Tutorials:
    - Basics:
      - Understanding Packets: tutorials/basics/understanding_packets.md
      - Why Vision Transformers: tutorials/basics/why_vit.md
      - First Classification: tutorials/basics/first_classification.md
    - Intermediate:
      - Image Encoding Methods: tutorials/intermediate/encoding_methods.md
      - Training Your Model: tutorials/intermediate/training.md
      - Model Evaluation: tutorials/intermediate/evaluation.md
    - Advanced:
      - Few-Shot Learning: tutorials/advanced/few_shot.md
      - Model Optimization: tutorials/advanced/optimization.md
      - Production Deployment: tutorials/advanced/deployment.md
  - Concepts:
    - Vision Transformers: concepts/vision_transformers.md
    - Attention Mechanisms: concepts/attention.md
    - Packet Encoding: concepts/packet_encoding.md
    - Few-Shot Learning: concepts/few_shot_learning.md
  - API Reference:
    - Data Processing: api/data_processing.md
    - Models: api/models.md
    - Training: api/training.md
    - Evaluation: api/evaluation.md
    - Utilities: api/utilities.md
  - Architecture:
    - System Overview: architecture/overview.md
    - Data Pipeline: architecture/data_pipeline.md
    - Model Architecture: architecture/model_architecture.md
    - Deployment: architecture/deployment.md
  - Research:
    - Papers: research/papers.md
    - Experiments: research/experiments.md
    - Results: research/results.md
    - Future Work: research/future_work.md
  - Best Practices:
    - Data Preprocessing: best_practices/preprocessing.md
    - Model Training: best_practices/training.md
    - Performance Tuning: best_practices/tuning.md
    - Debugging: best_practices/debugging.md
  - Contributing:
    - Guidelines: contributing/guidelines.md
    - Code Standards: contributing/code_standards.md
    - Documentation: contributing/documentation.md
  - About:
    - Team: about/team.md
    - License: about/license.md
    - Changelog: about/changelog.md

# Customization
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/your-org
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js